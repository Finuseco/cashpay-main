# À insérer dans le server HTTPS existant de cashpay-all.com.
# Le reste de la configuration du site statique reste inchangé.
location ^~ /api/recruitment/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering on;
}

# Le catalogue est public ; les sources serveur et fichiers d'exploitation ne le sont pas.
location ^~ /recruitment-server/ { deny all; }
location ^~ /deploy/ { deny all; }
location ^~ /test/ { deny all; }
location ^~ /docs/ { deny all; }
location ^~ /node_modules/ { deny all; }
location = /package.json { deny all; }
location = /package-lock.json { deny all; }
location ~ ^/(?:\.env(?:\.[^/]*)?|\.git)(?:/|$) { deny all; }
